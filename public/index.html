<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shoutcut icon" href="favicon.png" />
    <title>Webpack App</title>
  </head>
  <body>
    <div id="app">
      <div class="wrapper">
        <div class="player">
          <h1>Nature Sounds</h1>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
          <div class="buttons">
            <button data-sound="rain">
              <img src="/assets/icons/rain.svg" alt="Rain">
            </button>
            <button data-sound="summer">
              <img src="../assets/icons/summer.svg" alt="Summer">
            </button>
            <button data-sound="winter">
              <img src="../assets/icons/winter.svg" alt="Winter">
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
